<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Todo List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
<div class="container">
    <h2 class="text-center mb-4 fw-bold text-primary">Todo List ✅</h2>

    <a href="/tasks/add" class="btn btn-primary mb-3">Add Task</a>

    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Task</th>
                <th>Created At</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.id}"></td>
                <td th:text="${task.task}"></td>

                <!-- ✅ Proper Created Date Formatting -->
                <td th:text="${#temporals.format(task.createdAt, 'dd-MM-yyyy HH:mm')}"></td>

                <td>
                    <input type="checkbox"
                           class="form-check-input"
                           th:checked="${task.isComplete}"
                           th:data-id="${task.id}"
                           onchange="updateStatus(this)">
                    <span th:text="${task.isComplete ? '✅ Done' : '🕒 Pending'}"></span>
                </td>

                <td>
                    <a th:href="@{/tasks/edit/{id}(id=${task.id})}" class="btn btn-sm btn-warning">✏ Edit</a>
                    <a th:href="@{/tasks/delete/{id}(id=${task.id})}" class="btn btn-sm btn-danger">🗑 Delete</a>
                </td>
            </tr>
            </tbody>

        </table>
    </div>
</div>

<script>
function updateStatus(checkbox) {
    const id = checkbox.getAttribute("data-id");
    fetch(`/api/tasks/status/${id}`, {
        method: "PUT"
    }).then(() => location.reload());
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
